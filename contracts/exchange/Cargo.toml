[package]
name = "near-purple-exchange"
version = "0.1.0"
edition = "2021"
license = "MIT"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
near-sdk = "=5.29.1"
borsh = { version = "1", features = ["derive"] }
purple-engine = { path = "../../crates/engine" }
[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }

[features]
default = []
test-oracle = []
