name: Verify NEAR fork
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: npm ci
      - run: npm run build:contract
      - run: npm run test:sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: near-purple-contracts
          path: artifacts/*.wasm
